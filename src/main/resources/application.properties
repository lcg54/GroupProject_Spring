spring.application.name=rental
server.port=9000
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
productImageLocation=C:/shop/images
productImageSubLocation=C:/shop/images/category
spring.datasource.url=jdbc:mysql://localhost:3306/rental?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
